aid: antech-diagnostics
url: https://raw.githubusercontent.com/api-evangelist/antech-diagnostics/refs/heads/main/apis.yml
name: Antech Diagnostics
kind: company
description: Antech Diagnostics operates North America's largest veterinary reference
  laboratory network, plus in-house diagnostic instruments, imaging, and the
  HealthTracks diagnostics platform. Antech is part of Mars Petcare (Mars Veterinary
  Health), acquired via Mars' 2017 purchase of VCA. Antech's programmatic surface is
  a partner-gated laboratory integration API - commonly configured in practice
  information management systems (PIMS) as "Antech V3" - that lets veterinary
  software submit lab requisitions to Antech and receive results back into the
  patient's medical record. There is no public, self-serve developer portal or
  published API reference; access requires an Antech account and a business /
  integration partner relationship, authenticated with an Account Number, Username,
  Password, and Clinic ID. The logical APIs below are modeled from documented PIMS
  integration behavior (Vetspire, Cornerstone, DaySmart Vet, NaVetor, ezyVet,
  NectarVet), not from an Antech-published specification.
