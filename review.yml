actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No public WebSocket surface exists, and Antech publishes no public API reference
    at all. The only programmatic surface is a partner-gated PIMS lab integration
    ("Antech V3") for submitting requisitions and receiving results. The apis.yml
    documents this honestly with modeled logical APIs (endpointsModeled: true) and
    no fabricated endpoints, OpenAPI, plans, or rate limits.
